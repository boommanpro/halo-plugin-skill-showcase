<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill 展示 - Halo SkillHub</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/styles/github.min.css" id="hljs-light">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/styles/github-dark.min.css" id="hljs-dark" disabled>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/highlight.min.js"></script>
<style>
:root {
  --bg-body: #f8f9fa;
  --bg-sidebar: #ffffff;
  --bg-card: #ffffff;
  --bg-hover: #f1f3f5;
  --bg-active: #e8f0fe;
  --border-color: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --text-muted: #adb5bd;
  --accent: #0d6efd;
  --accent-hover: #0b5ed7;
  --accent-light: #e8f0fe;
  --code-bg: #0d1117;
  --code-text: #e6edf3;
  --sidebar-width: 260px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-body: #0d1117;
    --bg-sidebar: #161b22;
    --bg-card: #161b22;
    --bg-hover: #21262d;
    --bg-active: #1f6feb33;
    --border-color: #30363d;
    --text-primary: #f0f6fc;
    --text-secondary: #8b949e;
    --text-muted: #6e7681;
    --accent: #2f81f7;
    --accent-hover: #1f6feb;
    --accent-light: #1f6feb33;
  }
  #hljs-light { disabled: true; }
  #hljs-dark { disabled: false; }
}
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg-body);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.6;
  margin: 0;
}

.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: var(--sidebar-width);
  height: 100vh;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  z-index: 100;
  transition: transform 0.2s ease;
}
.sidebar-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border-color);
}
.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text-primary);
  font-weight: 700;
  font-size: 16px;
}
.sidebar-logo-icon {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 15px; font-weight: 800;
}
.sidebar-logo-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

.sidebar-section { padding: 12px 0; }
.sidebar-section-title {
  padding: 6px 20px;
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text-muted);
}
.sidebar-nav { list-style: none; padding: 0; margin: 0; }

.sidebar-link {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 20px;
  color: var(--text-secondary);
  text-decoration: none; font-size: 14px; font-weight: 500;
  border-left: 3px solid transparent;
  transition: all 0.15s;
  cursor: pointer;
}
.sidebar-link:hover { background: var(--bg-hover); color: var(--text-primary); }
.sidebar-link.active {
  background: var(--accent-light);
  color: var(--accent);
  border-left-color: var(--accent);
  font-weight: 600;
}
.sidebar-link i { width: 18px; text-align: center; font-size: 14px; }
.sidebar-link .badge-count {
  margin-left: auto;
  font-size: 11px;
  background: var(--bg-hover); color: var(--text-muted);
  padding: 1px 7px; border-radius: 10px; font-weight: 500;
}
.sidebar-link.active .badge-count { background: var(--accent); color: #fff; }

.sidebar-search { padding: 12px 20px; border-top: 1px solid var(--border-color); }
.sidebar-search input {
  width: 100%; padding: 7px 12px;
  border: 1px solid var(--border-color); border-radius: 6px;
  background: var(--bg-body); color: var(--text-primary);
  font-size: 13px; outline: none; transition: border-color 0.15s;
}
.sidebar-search input:focus { border-color: var(--accent); }
.sidebar-search input::placeholder { color: var(--text-muted); }

.sidebar-footer {
  margin-top: auto; padding: 16px 20px;
  border-top: 1px solid var(--border-color);
  font-size: 12px; color: var(--text-muted);
}

.main {
  margin-left: var(--sidebar-width);
  padding: 28px 36px 60px;
  min-height: 100vh;
}
.main-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px; padding-bottom: 16px;
  border-bottom: 1px solid var(--border-color);
}
.main-title {
  font-size: 22px; font-weight: 700;
  color: var(--text-primary); margin: 0; letter-spacing: -0.3px;
}
.main-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.main-stats { display: flex; gap: 16px; }
.stat-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: 8px; font-size: 12px; color: var(--text-secondary);
}
.stat-chip strong { color: var(--text-primary); font-weight: 600; }

.skills-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; margin-bottom: 16px;
}
.skills-count { font-size: 13px; color: var(--text-muted); }
.skills-count strong { color: var(--text-primary); font-weight: 600; }

.skills-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}
.skill-card {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: 10px; padding: 20px;
  cursor: pointer;
  transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s;
  text-decoration: none; color: inherit; display: block;
}
.skill-card:hover {
  border-color: var(--accent);
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  transform: translateY(-2px);
}
.skill-card-header {
  display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px;
}
.skill-card-icon {
  width: 44px; height: 44px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 16px; font-weight: 700; color: #fff;
}
.skill-card-icon.c1{background:#2563eb;} .skill-card-icon.c2{background:#7c3aed;}
.skill-card-icon.c3{background:#0891b2;} .skill-card-icon.c4{background:#059669;}
.skill-card-icon.c5{background:#d97706;} .skill-card-icon.c6{background:#dc2626;}
.skill-card-icon.c7{background:#db2777;} .skill-card-icon.c8{background:#4f46e5;}
.skill-card-info { flex: 1; min-width: 0; }
.skill-card-title {
  font-size: 15px; font-weight: 600; color: var(--text-primary);
  margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.skill-card-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge-tag {
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500;
}
.badge-category { background: var(--accent-light); color: var(--accent); }
.badge-type { background: var(--bg-hover); color: var(--text-secondary); }
.skill-card-summary {
  color: var(--text-secondary); font-size: 13px; line-height: 1.5;
  margin-bottom: 12px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.skill-card-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 12px; border-top: 1px solid var(--border-color);
}
.skill-card-stats { display: flex; gap: 14px; font-size: 12px; color: var(--text-muted); }
.skill-card-stats i { margin-right: 3px; font-size: 12px; }
.skill-card-action { color: var(--accent); font-size: 12px; font-weight: 500; }

.detail-header {
  display: flex; align-items: flex-start; gap: 20px;
  margin-bottom: 28px; padding: 24px;
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px;
}
.detail-icon {
  width: 64px; height: 64px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.detail-info { flex: 1; min-width: 0; }
.detail-title-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 8px; flex-wrap: wrap;
}
.detail-title { font-size: 24px; font-weight: 700; color: var(--text-primary); margin: 0; }
.detail-version {
  padding: 2px 8px; background: var(--bg-hover); border-radius: 4px;
  font-size: 12px; font-weight: 600; color: var(--text-secondary);
  font-family: ui-monospace, monospace;
}
.detail-badges { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.detail-summary { color: var(--text-secondary); font-size: 14px; margin-bottom: 12px; }
.detail-stats {
  display: flex; gap: 24px; padding-top: 14px;
  border-top: 1px solid var(--border-color);
}
.detail-stat { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 13px; }
.detail-stat strong { color: var(--text-primary); font-weight: 600; }

.detail-tabs {
  display: flex; gap: 2px;
  border-bottom: 2px solid var(--border-color); margin-bottom: 20px;
}
.detail-tab {
  padding: 10px 18px; border: none; background: transparent;
  font-size: 14px; font-weight: 500; color: var(--text-secondary);
  cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px;
  transition: all 0.15s;
}
.detail-tab:hover { color: var(--text-primary); }
.detail-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.detail-tab-content { display: none; }
.detail-tab-content.active { display: block; }

.markdown-body { max-width: 820px; line-height: 1.7; }
.markdown-body h1 {
  font-size: 1.8em; font-weight: 700;
  padding-bottom: 10px; border-bottom: 1px solid var(--border-color); margin: 0 0 20px;
}
.markdown-body h2 {
  font-size: 1.4em; font-weight: 600;
  margin: 28px 0 14px; padding-bottom: 6px; border-bottom: 1px solid var(--border-color);
}
.markdown-body h3 { font-size: 1.2em; font-weight: 600; margin: 22px 0 10px; }
.markdown-body p { margin: 10px 0; }
.markdown-body ul, .markdown-body ol { padding-left: 24px; margin: 10px 0; }
.markdown-body li { margin: 4px 0; }
.markdown-body code {
  background: var(--bg-hover); padding: 2px 6px; border-radius: 4px;
  font-size: 0.88em; font-family: ui-monospace, monospace;
}
.markdown-body pre {
  background: var(--code-bg); border-radius: 8px; padding: 16px;
  overflow-x: auto; margin: 14px 0; font-size: 13px; line-height: 1.55;
}
.markdown-body pre code { background: transparent; padding: 0; color: var(--code-text); }
.markdown-body blockquote {
  border-left: 4px solid var(--accent); color: var(--text-secondary);
  padding: 0 14px; margin: 14px 0;
}
.markdown-body table { border-collapse: collapse; margin: 14px 0; width: 100%; }
.markdown-body th, .markdown-body td { border: 1px solid var(--border-color); padding: 8px 14px; }
.markdown-body th { background: var(--bg-hover); font-weight: 600; }
.markdown-body a { color: var(--accent); text-decoration: none; }
.markdown-body a:hover { text-decoration: underline; }

.files-layout { display: grid; grid-template-columns: 240px 1fr; gap: 20px; }
.file-tree {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: 10px; padding: 12px;
  max-height: 600px; overflow-y: auto;
}
.file-tree-title {
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text-muted); padding: 4px 10px 10px;
}
.file-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 6px; cursor: pointer;
  font-size: 13px; color: var(--text-secondary);
  transition: all 0.12s;
  border: none; background: transparent; text-align: left; width: 100%; font-family: inherit;
}
.file-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.file-item.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }
.file-item svg { width: 15px; height: 15px; flex-shrink: 0; }
.file-item .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-item .flang {
  font-size: 10px; padding: 1px 5px; border-radius: 3px;
  background: var(--bg-hover); color: var(--text-muted);
}
.file-item.active .flang { background: var(--accent-light); color: var(--accent); }

.code-viewer { background: var(--code-bg); border-radius: 10px; overflow: hidden; }
.code-viewer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; background: #161b22; border-bottom: 1px solid #21262d;
}
.code-viewer-title { display: flex; align-items: center; gap: 8px; color: var(--code-text); font-size: 13px; }
.code-viewer-body { padding: 16px; overflow-x: auto; display: flex; }
.code-line-numbers {
  display: inline-block; text-align: right;
  padding-right: 16px; margin-right: 16px;
  border-right: 1px solid #30363d; color: #484f58;
  font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.55;
  user-select: none; min-width: 2.5em;
}
.code-content { flex: 1; }
.code-content pre { margin: 0; padding: 0; background: transparent; }
.copy-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 12px; background: #21262d; border: 1px solid #30363d;
  border-radius: 6px; color: var(--code-text); font-size: 12px; cursor: pointer; transition: background 0.15s;
}
.copy-btn:hover { background: #30363d; }

.action-buttons { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
.action-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
  cursor: pointer; border: 1px solid var(--border-color);
  background: var(--bg-card); color: var(--text-primary);
  transition: all 0.15s; text-decoration: none;
}
.action-btn:hover { background: var(--bg-hover); }
.action-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.action-btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

.loading-state, .empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 80px 20px; color: var(--text-secondary); grid-column: 1 / -1;
}
.loading-state i, .empty-state i {
  font-size: 36px; margin-bottom: 16px; color: var(--text-muted);
}
.empty-state h3 { color: var(--text-primary); font-size: 16px; margin-bottom: 6px; }
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border-color); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--text-primary); color: var(--bg-body);
  padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 500;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  opacity: 0; transition: opacity 0.2s, transform 0.2s;
  pointer-events: none; z-index: 200;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 6px;
  color: var(--text-secondary); text-decoration: none;
  font-size: 13px; font-weight: 500; margin-bottom: 16px;
  transition: all 0.15s; cursor: pointer; border: none; background: transparent;
}
.back-btn:hover { background: var(--bg-hover); color: var(--text-primary); }

.info-table { width: 100%; max-width: 600px; border-collapse: collapse; }
.info-table td { padding: 10px 14px; border-bottom: 1px solid var(--border-color); font-size: 13px; }
.info-table td:first-child { color: var(--text-muted); width: 120px; font-weight: 500; }
.info-table td:last-child { color: var(--text-primary); }

.related-title {
  font-size: 16px; font-weight: 600; margin-bottom: 16px; color: var(--text-primary);
}
.related-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;
}
.related-card {
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px;
  padding: 16px; cursor: pointer; transition: all 0.15s;
  display: flex; align-items: flex-start; gap: 12px; text-decoration: none; color: inherit;
}
.related-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.06); transform: translateY(-1px); }
.related-icon {
  width: 36px; height: 36px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 14px; font-weight: 700; color: #fff;
}
.related-info { flex: 1; min-width: 0; }
.related-name {
  font-size: 13px; font-weight: 600; color: var(--text-primary);
  margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.related-summary {
  font-size: 12px; color: var(--text-secondary); line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

.mobile-toggle {
  display: none; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: 8px;
  border: 1px solid var(--border-color); background: var(--bg-card);
  color: var(--text-primary); cursor: pointer;
  position: fixed; top: 12px; left: 12px; z-index: 200;
}
.sidebar-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.4); z-index: 99;
}
.sidebar-overlay.show { display: block; }

@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); width: 260px; }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; padding: 20px 16px; }
  .mobile-toggle { display: flex; }
  .files-layout { grid-template-columns: 1fr; }
  .file-tree { max-height: 300px; }
  .skills-list { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<button class="mobile-toggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">
  <i class="fas fa-bars"></i>
</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <a class="sidebar-logo" href="/showcase" onclick="navigateTo('/', event)">
      <span class="sidebar-logo-icon">S</span>
      <div>
        <div class="sidebar-logo-text">SkillHub</div>
        <div class="sidebar-logo-sub">AI Skill 生态</div>
      </div>
    </a>
  </div>

  <div class="sidebar-search">
    <input type="text" id="sidebar-search" placeholder="搜索 Skill...">
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-title">导航</div>
    <ul class="sidebar-nav">
      <li><a class="sidebar-link active" data-view="all" onclick="navigateTo('/', event)">
        <i class="fas fa-th-large"></i><span>全部技能</span>
        <span class="badge-count" id="count-all">0</span>
      </a></li>
      <li><a class="sidebar-link" data-view="categories" onclick="navigateTo('/categories', event)">
        <i class="fas fa-folder"></i><span>分类浏览</span>
      </a></li>
      <li><a class="sidebar-link" data-view="stats" onclick="navigateTo('/stats', event)">
        <i class="fas fa-chart-bar"></i><span>数据统计</span>
      </a></li>
    </ul>
  </div>

  <div class="sidebar-section" id="categories-section" style="display:none;">
    <div class="sidebar-section-title">分类</div>
    <ul class="sidebar-nav" id="categories-nav"></ul>
  </div>

  <div class="sidebar-footer">
    <div>Powered by SkillShowcase</div>
  </div>
</aside>

<main class="main" id="main"></main>

<div class="toast" id="toast"></div>

<script>
marked.setOptions({ breaks: true, gfm: true });

const API_BASE = '/showcase-api';
let allSkills = [];
let categories = [];
let stats = null;

const LANG_ICONS = {
  'markdown':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  'java':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="9" y1="7" x2="15" y2="7"/></svg>',
  'python':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  'javascript':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/></svg>',

  'json':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  'shell':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>',
  'default':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'
};

function getInitial(name) {
  if (!name) return '?';
  const cleaned = name.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '');
  if (/[\u4e00-\u9fa5]/.test(cleaned)) return cleaned.substring(0, 1);
  return cleaned.substring(0, 2).toUpperCase();
}
function getIconColor(name) {
  if (!name) return 'c1';
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return ['c1','c2','c3','c4','c5','c6','c7','c8'][Math.abs(hash) % 8];
}
function guessLanguage(path) {
  if (!path) return '';
  const ext = path.split('.').pop().toLowerCase();
  const map = {md:'markdown',java:'java',js:'javascript',ts:'typescript',jsx:'javascript',tsx:'typescript',py:'python',html:'html',css:'css',json:'json',xml:'xml',yml:'yaml',yaml:'yaml',sh:'shell',sql:'sql',go:'go',rs:'rust',rb:'ruby',php:'php',vue:'html',c:'c',cpp:'cpp',cs:'csharp'};
  return map[ext] || '';
}
function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function formatNumber(n) {
  if (n == null) return '0';
  const num = Number(n);
  if (num >= 10000) return (num/10000).toFixed(1) + 'w';
  if (num >= 1000) return (num/1000).toFixed(1) + 'k';
  return String(num);
}
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 2000);
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}
function copyText(text) {
  if (navigator.clipboard) { navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板')); return; }
  const ta = document.createElement('textarea'); ta.value = text;
  document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
  showToast('已复制到剪贴板');
}

async function init() {
  updateMain('<div class="loading-state"><div class="spinner"></div><p>加载中...</p></div>');
  try {
    const [statsData, catsData, skillsData] = await Promise.all([
      fetch(API_BASE + '/stats').then(r => r.json()).catch(() => null),
      fetch(API_BASE + '/categories').then(r => r.json()).catch(() => []),
      fetch(API_BASE + '/skills').then(r => r.json()).catch(() => [])
    ]);
    stats = statsData;
    categories = catsData || [];
    allSkills = skillsData || [];
    updateCategoryNav();
    document.getElementById('count-all').textContent = allSkills.length;
    const path = window.location.pathname.replace('/showcase', '') || '/';
    handleRoute(path);
    window.addEventListener('popstate', () => {
      const p = window.location.pathname.replace('/showcase', '') || '/';
      handleRoute(p);
    });
  } catch (e) {
    updateMain('<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>加载失败</h3><p>请稍后重试</p></div>');
  }
}

function updateCategoryNav() {
  const nav = document.getElementById('categories-nav');
  const section = document.getElementById('categories-section');
  if (!categories || categories.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  nav.innerHTML = categories.map(c => {
    const count = allSkills.filter(s => s.category === c.name).length;
    return `<li><a class="sidebar-link" data-category="${escapeHtml(c.name)}" onclick="filterByCategory('${escapeHtml(c.name)}', event)">
      <i class="fas fa-circle" style="font-size:8px;"></i><span>${escapeHtml(c.displayName || c.name)}</span>
      <span class="badge-count">${count}</span>
    </a></li>`;
  }).join('');
}

function navigateTo(path, event) {
  if (event) { event.preventDefault(); event.stopPropagation(); }
  const fullPath = '/showcase' + (path === '/' ? '' : path);
  window.history.pushState({}, '', fullPath);
  handleRoute(path);
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

function handleRoute(path) {
  setActiveNav(path);
  const cleanPath = path.replace(/\/+$/, '') || '/';
  if (cleanPath === '/') renderSkillList();
  else if (cleanPath === '/categories') renderCategoriesView();
  else if (cleanPath === '/stats') renderStatsView();
  else if (cleanPath.startsWith('/category/')) {
    renderSkillList(decodeURIComponent(cleanPath.substring('/category/'.length)));
  } else if (cleanPath.startsWith('/skill/')) {
    renderSkillDetail(decodeURIComponent(cleanPath.substring('/skill/'.length)));
  } else renderSkillList();
}

function setActiveNav(path) {
  document.querySelectorAll('.sidebar-link').forEach(link => {
    link.classList.remove('active');
    if (path === '/' || path === '') { if (link.dataset.view === 'all') link.classList.add('active'); }
    else if (path === '/categories' && link.dataset.view === 'categories') link.classList.add('active');
    else if (path === '/stats' && link.dataset.view === 'stats') link.classList.add('active');
    else if (path.startsWith('/category/') && link.dataset.category === path.substring('/category/'.length)) {
      link.classList.add('active');
    }
  });
}

function filterByCategory(catName, event) {
  if (event) { event.preventDefault(); event.stopPropagation(); }
  navigateTo('/category/' + encodeURIComponent(catName));
}

function updateMain(html) {
  document.getElementById('main').innerHTML = html;
  window.scrollTo(0, 0);
}

function renderSkillList(categoryFilter) {
  let skills = categoryFilter ? allSkills.filter(s => s.category === categoryFilter) : allSkills;
  const searchInput = document.getElementById('sidebar-search');
  const search = searchInput ? searchInput.value.toLowerCase() : '';
  if (search) {
    skills = skills.filter(s =>
      (s.displayName && s.displayName.toLowerCase().includes(search)) ||
      (s.name && s.name.toLowerCase().includes(search)) ||
      (s.summary && s.summary.toLowerCase().includes(search)) ||
      (s.tags && s.tags.some(t => t.toLowerCase().includes(search)))
    );
  }

  const catLabel = categoryFilter ? (categories.find(c => c.name === categoryFilter)?.displayName || categoryFilter) : '';
  const title = categoryFilter ? catLabel : '全部技能';
  const subtitle = categoryFilter ? '浏览该分类下的所有技能' : '探索和管理高质量的 AI Skill';

  let html = `
    <div class="main-header">
      <div>
        <h1 class="main-title">${escapeHtml(title)}</h1>
        <div class="main-subtitle">${escapeHtml(subtitle)}</div>
      </div>
      <div class="main-stats">
        <div class="stat-chip"><i class="fas fa-cube"></i><strong>${stats?.totalSkills || 0}</strong> 技能</div>
        <div class="stat-chip"><i class="fas fa-download"></i><strong>${formatNumber(stats?.totalDownloads || 0)}</strong> 下载</div>
      </div>
    </div>
    <div class="skills-toolbar">
      <div class="skills-count">共 <strong>${skills.length}</strong> 个技能${search ? ' · 搜索"' + escapeHtml(search) + '"' : ''}</div>
    </div>
  `;

  if (!skills.length) {
    html += `<div class="empty-state"><i class="fas fa-inbox"></i><h3>${search ? '没有匹配的技能' : '暂无技能'}</h3><p>${search ? '尝试调整搜索条件' : categoryFilter ? '该分类下还没有技能' : '管理员还没有发布任何技能'}</p></div>`;
  } else {
    html += '<div class="skills-list">' + skills.map(renderSkillCard).join('') + '</div>';
  }

  updateMain(html);
  attachCardEvents();
}

function renderSkillCard(s) {
  const initial = getInitial(s.displayName || s.name);
  const colorClass = getIconColor(s.name || s.displayName);
  let typeLabel = '文档';
  if (s.sourceType === 'zip') typeLabel = '演示站';
  else if (s.sourceType === 'external') typeLabel = '外链';
  else if (s.files && s.files.length > 0) typeLabel = '项目';

  const catBadge = s.categoryName ? `<span class="badge-tag badge-category">${escapeHtml(s.categoryName)}</span>` : '';
  const version = s.version || '';
  const downloads = s.downloads ?? 0;
  const rating = s.rating ?? 0;

  return `
    <div class="skill-card" data-name="${escapeHtml(s.name)}">
      <div class="skill-card-header">
        <div class="skill-card-icon ${colorClass}">${escapeHtml(initial)}</div>
        <div class="skill-card-info">
          <div class="skill-card-title">${escapeHtml(s.displayName || s.name)}</div>
          <div class="skill-card-badges">
            ${catBadge}
            <span class="badge-tag badge-type">${typeLabel}</span>
            ${version ? `<span class="badge-tag badge-type">v${escapeHtml(version)}</span>` : ''}
          </div>
        </div>
      </div>
      <div class="skill-card-summary">${escapeHtml(s.summary || '暂无描述')}</div>
      <div class="skill-card-footer">
        <div class="skill-card-stats">
          <span><i class="fas fa-download"></i>${formatNumber(downloads)}</span>
          ${rating > 0 ? `<span><i class="fas fa-star" style="color:#f59e0b;"></i>${rating.toFixed(1)}</span>` : ''}
        </div>
        <div class="skill-card-action">查看详情 →</div>
      </div>
    </div>
  `;
}

function attachCardEvents() {
  document.querySelectorAll('.skill-card').forEach(card => {
    card.addEventListener('click', () => navigateTo('/skill/' + encodeURIComponent(card.dataset.name)));
  });
}

    html += '<div id="related-section" style="margin-top:32px;"></div>';
    updateMain(html);

    if (window.hljs) document.querySelectorAll('.markdown-body pre code').forEach(b => hljs.highlightElement(b));

    document.querySelectorAll('.detail-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.detail-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.detail-tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        const tabId = tab.dataset.tab;
        document.getElementById('tab-' + tabId).classList.add('active');
        if (tabId === 'files') renderCodeFile(0);
      });
    });
    document.querySelectorAll('.file-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        renderCodeFile(parseInt(item.dataset.fileIdx));
      });
    });
    if (hasCode) renderCodeFile(0);
    loadRelatedSkills(skillName);
  } catch (e) {
    updateMain('<button class="back-btn" onclick="navigateTo(\'/\', event)"><i class="fas fa-arrow-left"></i> 返回列表</button><div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>加载失败</h3><p>Skill 不存在或已被删除</p></div>');
  }
}

function renderCodeFile(idx) {
  const activeTab = document.querySelector('.detail-tab-content.active');
  if (!activeTab) return;
  const codeFiles = window._currentCodeFiles || [];
  if (!codeFiles || !codeFiles[idx]) return;
  const f = codeFiles[idx];
  const code = f.content || '';
  const lines = code.split('\n');
  document.getElementById('current-filename').textContent = f.name || f.path;
  document.getElementById('line-numbers').textContent = lines.map((_, i) => i + 1).join('\n');
  const contentEl = document.getElementById('code-content');
  contentEl.innerHTML = '<pre><code id="code-highlight">' + escapeHtml(code) + '</code></pre>';
  if (window.hljs) hljs.highlightElement(document.getElementById('code-highlight'));
  window._currentCode = code;
}

function currentSkillFiles() {
  const activeTab = document.querySelector('.detail-tab-content.active');
  if (!activeTab) return null;
  return window._currentSkillFiles || null;
}

function copyCurrentCode() {
  if (window._currentCode) copyText(window._currentCode);
}

async function loadRelatedSkills(skillName) {
  try {
    const related = await fetch(API_BASE + '/skills/' + encodeURIComponent(skillName) + '/related').then(r => r.json());
    const section = document.getElementById('related-section');
    if (!section || !related || !related.length) return;
    let html = '<h2 class="related-title">相关技能</h2><div class="related-grid">';
    related.forEach(r => {
      html += '<div class="related-card" onclick="navigateTo(\'/skill/' + encodeURIComponent(r.name) + '\', event)">' +
        '<div class="related-icon ' + getIconColor(r.name) + '">' + getInitial(r.displayName || r.name) + '</div>' +
        '<div class="related-info"><div class="related-name">' + escapeHtml(r.displayName || r.name) + '</div>' +
        '<div class="related-summary">' + escapeHtml(r.summary || '') + '</div></div></div>';
    });
    html += '</div>';
    section.innerHTML = html;
  } catch (e) {}
}

function skillDownloadUrl(name) {
  return API_BASE + '/skills/' + encodeURIComponent(name) + '/download';
}

function doDownload(name) {
  const a = document.createElement('a');
  a.href = skillDownloadUrl(name);
  a.download = '';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function buildInstallCmd(name) {
  const url = new URL(skillDownloadUrl(name), location.origin).toString();
  const safeName = encodeURIComponent(name);
  const win = /win/i.test(navigator.platform) || /windows/i.test(navigator.userAgent);
  const mac = /mac|iphone|ipad/i.test(navigator.platform);
  if (win) {
    return { os: 'powershell', cmd: `$dir = Join-Path $env:USERPROFILE '.halo\\skills'; New-Item -ItemType Directory -Force -Path $dir | Out-Null; Invoke-WebRequest -Uri '${url}' -OutFile (Join-Path $dir '${safeName}.zip'); Expand-Archive -Path (Join-Path $dir '${safeName}.zip') -DestinationPath (Join-Path $dir '${safeName}') -Force` };
  }
  return { os: mac ? 'macOS / bash' : 'Linux / bash', cmd: `mkdir -p "$HOME/.halo/skills" && curl -fsSL '${url}' -o "$HOME/.halo/skills/${safeName}.zip" && unzip -o "$HOME/.halo/skills/${safeName}.zip" -d "$HOME/.halo/skills/${safeName}"` };
}

function copyInstallCmd(name) {
  copyText(buildInstallCmd(name).cmd).then(() => showToast('安装命令已复制'));
}

// Expose for inline handlers
window.navigateTo = navigateTo;
window.toggleSidebar = toggleSidebar;
window.filterByCategory = filterByCategory;
window.doDownload = doDownload;
window.copyInstallCmd = copyInstallCmd;
window.copyText = copyText;
window.copyCurrentCode = copyCurrentCode;

// Search input
document.addEventListener('DOMContentLoaded', () => {
  const searchInput = document.getElementById('sidebar-search');
  if (searchInput) {
    searchInput.addEventListener('input', () => {
      const path = window.location.pathname.replace('/showcase', '') || '/';
      if (path === '/' || path.startsWith('/category/')) handleRoute(path);
    });
  }
  init();
});
</script>
</body>
</html>
