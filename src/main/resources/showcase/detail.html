<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技能详情 - Skill Showcase</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/styles/github.min.css" id="hljs-light">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/styles/github-dark.min.css" id="hljs-dark" disabled>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/highlight.min.js"></script>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --bg-code: #0d1117;
            --border-color: #e2e8f0;
            --border-muted: #e9ecef;
            --border-hover: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #dbeafe;
            --accent-subtle: #eff6ff;
            --code-text: #e6edf3;
            --card-shadow: 0 1px 3px rgba(0,0,0,0.04);
            --card-hover-shadow: 0 4px 12px rgba(0,0,0,0.08);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0d1117;
                --bg-secondary: #010409;
                --bg-tertiary: #161b22;
                --bg-code: #0d1117;
                --border-color: #30363d;
                --border-muted: #21262d;
                --border-hover: #484f58;
                --text-primary: #f0f6fc;
                --text-secondary: #8b949e;
                --text-muted: #6e7681;
                --accent: #2f81f7;
                --accent-hover: #1f6feb;
                --accent-light: #1f6feb33;
                --accent-subtle: #1f6feb1a;
                --code-text: #e6edf3;
                --card-shadow: 0 1px 3px rgba(0,0,0,0.3);
                --card-hover-shadow: 0 4px 12px rgba(0,0,0,0.4);
            }
            #hljs-light { disabled: true; }
            #hljs-dark { disabled: false; }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .container {
            max-width: 1160px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        .site-header {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .site-header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
        }
        .site-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.2px;
        }
        .site-logo .logo-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: 800;
        }
        .site-nav { display: flex; gap: 4px; align-items: center; }
        .site-nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.15s;
        }
        .site-nav a:hover { color: var(--text-primary); background: var(--bg-tertiary); }

        /* Breadcrumb */
        .breadcrumb-bar {
            padding: 12px 0;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .breadcrumb-bar a { color: var(--accent); text-decoration: none; }
        .breadcrumb-bar a:hover { text-decoration: underline; }
        .breadcrumb-bar .sep { color: var(--text-muted); margin: 0 6px; }
        .breadcrumb-bar .current { color: var(--text-primary); font-weight: 500; }

        /* Skill Header */
        .skill-header {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 24px;
        }
        .skill-header-top {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
        }
        .skill-icon-xl {
            width: 72px;
            height: 72px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }
        .skill-icon-xl.c1 { background: #2563eb; }
        .skill-icon-xl.c2 { background: #7c3aed; }
        .skill-icon-xl.c3 { background: #0891b2; }
        .skill-icon-xl.c4 { background: #059669; }
        .skill-icon-xl.c5 { background: #d97706; }
        .skill-icon-xl.c6 { background: #dc2626; }
        .skill-icon-xl.c7 { background: #db2777; }
        .skill-icon-xl.c8 { background: #4f46e5; }

        .skill-info-main { flex: 1; min-width: 0; }
        .skill-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .skill-name {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .version-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
        }
        .skill-badges-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-category { background: var(--accent-light); color: var(--accent); }
        .badge-type { background: var(--bg-tertiary); color: var(--text-secondary); }
        .badge-status { background: #05966922; color: #059669; }
        .badge-status.draft { background: #d9770622; color: #d97706; }

        .skill-summary {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .author-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .author-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .author-name {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Stats */
        .stats-row {
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 16px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .stat-item svg { width: 16px; height: 16px; }
        .stat-item .stat-value { color: var(--text-primary); font-weight: 600; }
        .stat-item.rating { display: flex; align-items: center; gap: 4px; }
        .stat-stars { display: flex; gap: 2px; color: #f59e0b; }
        .stat-stars svg { width: 14px; height: 14px; }
        .stat-stars .empty { color: var(--text-muted); }

        /* Action Buttons */
        .action-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.15s;
            text-decoration: none;
        }
        .action-btn:hover { background: var(--bg-tertiary); border-color: var(--border-hover); }
        .action-btn svg { width: 15px; height: 15px; }
        .action-btn.primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .action-btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .action-btn.favorited {
            background: #dc2626;
            color: white;
            border-color: #dc2626;
        }
        .action-btn.favorited:hover { background: #b91c1c; border-color: #b91c1c; }
        .action-btn.favorited svg { fill: currentColor; }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
            background: var(--bg-primary);
            border-radius: 12px 12px 0 0;
            padding: 0 8px;
            border: 1px solid var(--border-color);
            border-bottom: none;
        }
        .tab-btn {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            border: none;
            background: transparent;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
            border-radius: 0;
        }
        .tab-btn:hover { color: var(--text-primary); }
        .tab-btn.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent);
            font-weight: 600;
        }
        .tab-btn svg { width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px; }

        /* Tab Content */
        .tab-content {
            display: none;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 0 0 12px 12px;
            padding: 32px;
        }
        .tab-content.active { display: block; }

        /* Markdown */
        .markdown-body {
            max-width: 860px;
            margin: 0 auto;
        }
        .markdown-body h1 {
            font-size: 1.8em;
            font-weight: 700;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            margin: 0 0 20px;
        }
        .markdown-body h2 {
            font-size: 1.4em;
            font-weight: 600;
            margin: 28px 0 14px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-muted);
        }
        .markdown-body h3 {
            font-size: 1.2em;
            font-weight: 600;
            margin: 22px 0 10px;
        }
        .markdown-body h4 {
            font-size: 1.05em;
            font-weight: 600;
            margin: 18px 0 8px;
        }
        .markdown-body p { margin: 10px 0; }
        .markdown-body ul, .markdown-body ol { padding-left: 24px; margin: 10px 0; }
        .markdown-body li { margin: 4px 0; }
        .markdown-body code {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.88em;
        }
        .markdown-body pre {
            background: var(--bg-code);
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            margin: 14px 0;
            font-size: 13px;
            line-height: 1.55;
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
            font-size: inherit;
            line-height: inherit;
            color: var(--code-text);
        }
        .markdown-body blockquote {
            border-left: 4px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0 14px;
            margin: 14px 0;
        }
        .markdown-body blockquote p { margin: 6px 0; }
        .markdown-body a { color: var(--accent); text-decoration: none; }
        .markdown-body a:hover { text-decoration: underline; }
        .markdown-body table {
            border-collapse: collapse;
            margin: 14px 0;
            width: 100%;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid var(--border-color);
            padding: 8px 14px;
        }
        .markdown-body th { background: var(--bg-secondary); font-weight: 600; }
        .markdown-body img { max-width: 100%; border-radius: 6px; }
        .markdown-body hr { border: none; border-top: 1px solid var(--border-muted); margin: 24px 0; }

        /* Files Tab */
        .files-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 0;
            max-width: 1100px;
            margin: 0 auto;
        }
        .file-tree-panel {
            border-right: 1px solid var(--border-color);
            padding-right: 16px;
            margin-right: 16px;
        }
        .file-tree-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 8px 10px;
        }
        .file-tree { display: flex; flex-direction: column; gap: 2px; }
        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            transition: all 0.12s;
            text-decoration: none;
            word-break: break-all;
            border: none;
            background: transparent;
            text-align: left;
            width: 100%;
            font-family: inherit;
        }
        .file-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }
        .file-item.active {
            background: var(--accent-light);
            color: var(--accent);
            font-weight: 500;
        }
        .file-icon-svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            color: var(--text-muted);
        }
        .file-item.active .file-icon-svg { color: var(--accent); }
        .file-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-lang {
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 3px;
            background: var(--bg-tertiary);
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .file-item.active .file-lang {
            background: rgba(37, 99, 235, 0.1);
            color: var(--accent);
        }

        .code-viewer-panel { min-width: 0; }
        .code-viewer {
            background: var(--bg-code);
            border-radius: 8px;
            overflow: hidden;
        }
        .code-viewer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: #161b22;
            border-bottom: 1px solid #21262d;
        }
        .code-viewer-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--code-text);
            font-size: 13px;
        }
        .code-viewer-title .filename { font-weight: 600; }
        .code-lang-pill {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: #21262d;
            color: var(--text-muted);
        }
        .code-viewer-body {
            padding: 16px;
            overflow-x: auto;
            display: flex;
        }
        .code-line-numbers {
            display: inline-block;
            text-align: right;
            padding-right: 16px;
            margin-right: 16px;
            border-right: 1px solid #30363d;
            color: #484f58;
            font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
            font-size: 13px;
            line-height: 1.55;
            user-select: none;
            min-width: 2.5em;
        }
        .code-content {
            flex: 1;
            font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
            font-size: 13px;
            line-height: 1.55;
        }
        .code-content pre { margin: 0; padding: 0; background: transparent; }
        .code-content code { font-family: inherit; font-size: inherit; line-height: inherit; }

        /* Copy button */
        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 12px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: var(--code-text);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            font-family: inherit;
        }
        .copy-btn:hover { background: #30363d; }
        .copy-btn svg { width: 13px; height: 13px; }
        .copy-btn.light {
            background: var(--bg-tertiary);
            border-color: var(--border-color);
            color: var(--text-primary);
        }
        .copy-btn.light:hover { background: var(--border-color); }

        /* Install Command */
        .install-section {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px 28px;
            margin-bottom: 24px;
        }
        .install-section h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .install-section h3 svg { width: 18px; height: 18px; color: var(--accent); }
        .install-section p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 14px;
        }
        .install-code-box {
            background: var(--bg-code);
            border-radius: 8px;
            overflow: hidden;
        }
        .install-code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #161b22;
            border-bottom: 1px solid #21262d;
        }
        .install-code-title {
            color: var(--code-text);
            font-size: 12px;
            font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
        }
        .install-code-body {
            padding: 16px;
            overflow-x: auto;
        }
        .install-code-body pre { margin: 0; }
        .install-code-body code {
            color: var(--code-text);
            font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        /* Related Skills */
        .related-section {
            margin-bottom: 40px;
        }
        .related-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .related-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .related-title svg { width: 18px; height: 18px; color: var(--accent); }
        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
        }
        .related-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .related-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--card-hover-shadow);
            transform: translateY(-1px);
            text-decoration: none;
        }
        .related-icon {
            width: 40px;
            height: 40px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 15px;
            font-weight: 700;
            color: white;
        }
        .related-icon.c1 { background: #2563eb; }
        .related-icon.c2 { background: #7c3aed; }
        .related-icon.c3 { background: #0891b2; }
        .related-icon.c4 { background: #059669; }
        .related-icon.c5 { background: #d97706; }
        .related-icon.c6 { background: #dc2626; }
        .related-icon.c7 { background: #db2777; }
        .related-icon.c8 { background: #4f46e5; }
        .related-info { flex: 1; min-width: 0; }
        .related-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .related-summary {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .related-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
            z-index: 200;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        @media (prefers-color-scheme: dark) {
            .toast {
                background: #f0f6fc;
                color: #0d1117;
            }
        }

        /* Loading / Empty */
        .loading, .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .loading svg, .empty-state svg {
            width: 40px;
            height: 40px;
            margin-bottom: 14px;
            color: var(--text-muted);
        }
        .empty-state h2 { font-size: 15px; margin-bottom: 4px; color: var(--text-primary); }

        /* skillhub-style VSCode file browser */
        .hub-browser {
            display: grid;
            grid-template-columns: 300px 1fr;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            background: var(--bg-primary);
            margin-top: 18px;
        }
        .hub-filetree {
            border-right: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            min-height: 400px;
            max-height: 600px;
            overflow: auto;
        }
        .hub-tree-title {
            padding: 12px 14px;
            font-size: 12px; font-weight: 600;
            text-transform: uppercase; letter-spacing: .4px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; background: var(--bg-tertiary); z-index: 2;
        }
        .hub-tree-title svg { width: 13px; height: 13px; vertical-align: -2px; }
        .hub-tree { padding: 6px 0; font-size: 13px; }
        .hub-folder-row, .hub-file {
            display: flex; align-items: center; gap: 6px;
            padding: 4px 8px 4px 0;
            color: var(--text-secondary); cursor: pointer; user-select: none;
            white-space: nowrap;
        }
        .hub-folder-row:hover, .hub-file:hover { background: var(--bg-hover); color: var(--text-primary); }
        .hub-folder-toggle {
            display: inline-flex; align-items: center; justify-content: center;
            width: 14px; height: 14px; color: var(--text-muted);
            transition: transform .15s; flex-shrink: 0;
        }
        .hub-folder.collapsed .hub-folder-toggle svg { transform: rotate(-90deg); }
        .hub-folder.collapsed .hub-folder-children { display: none; }
        .hub-folder-icon { color: #d4a72c; flex-shrink: 0; }
        .hub-file.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }
        .hub-file-name { overflow: hidden; text-overflow: ellipsis; }
        .hub-viewer {
            background: var(--bg-primary);
            max-height: 600px; overflow: auto;
        }
        .hub-viewer .code-viewer-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 2;
            gap: 8px; flex-wrap: wrap;
        }
        .hub-md-body { padding: 20px 26px; }
        @media (max-width: 900px) {
            .hub-browser { grid-template-columns: 1fr; }
            .hub-filetree { border-right: none; border-bottom: 1px solid var(--border-color); max-height: 260px; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .files-layout { grid-template-columns: 1fr; }
            .file-tree-panel { border-right: none; border-bottom: 1px solid var(--border-color); padding-right: 0; margin-right: 0; padding-bottom: 16px; margin-bottom: 16px; }
        }
        @media (max-width: 768px) {
            .skill-header { padding: 20px; }
            .skill-header-top { flex-direction: column; gap: 16px; }
            .skill-icon-xl { width: 56px; height: 56px; font-size: 20px; }
            .skill-name { font-size: 18px; }
            .stats-row { gap: 18px; flex-wrap: wrap; }
            .tab-content { padding: 20px 16px; }
            .tab-btn { padding: 10px 14px; font-size: 13px; }
            .install-section { padding: 20px 16px; }
            .container { padding: 0 16px; }
        }
    </style>
</head>

        };

        function getInitial(name) {
            if (!name) return '?';
            const cleaned = name.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '');
            if (/[\u4e00-\u9fa5]/.test(cleaned)) return cleaned.substring(0, 1);
            return cleaned.substring(0, 2).toUpperCase();
        }

        function getIconColor(name) {
            if (!name) return 'c1';
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            const colors = ['c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7', 'c8'];
            return colors[Math.abs(hash) % colors.length];
        }

        function getLangIcon(lang) {
            return LANG_ICONS[lang] || LANG_ICONS['default'];
        }

        function guessLanguage(path) {
            if (!path) return '';
            const ext = path.split('.').pop().toLowerCase();
            const map = {
                'md': 'markdown', 'java': 'java', 'js': 'javascript', 'ts': 'typescript',
                'jsx': 'javascript', 'tsx': 'typescript', 'py': 'python',
                'html': 'html', 'css': 'css', 'scss': 'css', 'json': 'json',
                'xml': 'xml', 'yml': 'yaml', 'yaml': 'yaml', 'sh': 'shell',
                'bash': 'shell', 'sql': 'sql', 'go': 'go', 'rs': 'rust',
                'rb': 'ruby', 'php': 'php', 'vue': 'html', 'svelte': 'html',
                'c': 'c', 'cpp': 'cpp', 'h': 'c', 'cs': 'csharp',
            };
            return map[ext] || '';
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatDate(iso) {
            if (!iso) return '';
            try {
                const d = new Date(iso);
                return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric' });
            } catch (e) { return iso; }
        }

        function formatNumber(n) {
            if (!n && n !== 0) return '0';
            if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
            return String(n);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text);
            }
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            return Promise.resolve();
        }

        async function init() {
            try {
                const skill = await fetch(`${API_BASE}/skills/${encodeURIComponent(skillName)}`).then(r => r.json());
                skillData = skill;
                // 浏览埋点：失败静默
                fetch(`${API_BASE}/skills/${encodeURIComponent(skillName)}/view`).catch(() => {});
                document.getElementById('breadcrumb-name').textContent = skill.displayName || skill.name;
                if (skill.categoryName) {
                    document.getElementById('breadcrumb-category').textContent = skill.categoryName;
                    document.getElementById('breadcrumb-category').href = `/showcase?category=${encodeURIComponent(skill.category || '')}`;
                }

                renderSkillHeader(skill);
                const isPackage = skill.sourceType === 'zip' || skill.sourceType === 'github';
                if (isPackage && skill.entryFile) {
                    // skillhub-style package (no index.html): VSCode-style file browser,
                    // defaulting to the markdown entry (SKILL.md / README.md)
                    renderSkillHubBrowser(skill);
                    renderInstallSection(skill);
                    renderRelatedSkills(skill);
                    showTab('readme');
                } else {
                    buildFileList();
                    renderTabs();
                    renderInstallSection(skill);
                    renderRelatedSkills(skill);
                    showTab('readme');
                }
            } catch (e) {
                document.getElementById('main-content').innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
                        <h2>加载失败</h2>
                        <p>Skill 不存在或已被删除</p>
                    </div>`;
            }
        }

        function buildFileList() {
            files = [];
            if (skillData.content) {
                files.push({ path: 'README.md', name: 'README.md', language: 'markdown', content: skillData.content });
            }
            if (skillData.files && skillData.files.length > 0) {
                skillData.files.forEach(f => {
                    if (f.content) {
                        const lang = f.language || guessLanguage(f.path);
                        files.push({
                            path: f.path,
                            name: f.name || f.path,
                            language: lang,
                            content: f.content,
                            size: f.size
                        });
                    }
                });
            }
        }

        function renderSkillHeader(skill) {
            const main = document.getElementById('main-content');
            const initial = getInitial(skill.displayName || skill.name);
            const colorClass = getIconColor(skill.name || skill.displayName);
            const authorInitial = getInitial(skill.author || '匿名');

            let typeLabel = '文档';
            if (skill.sourceType === 'github') typeLabel = 'GitHub';
            else if (skill.sourceType === 'external') typeLabel = '外链';
            else if (skill.files && skill.files.length > 0) typeLabel = '项目';

            const badges = [];
            if (skill.categoryName) {
                badges.push(`<span class="badge badge-category">${escapeHtml(skill.categoryName)}</span>`);
            }
            badges.push(`<span class="badge badge-type">${typeLabel}</span>`);
            if (skill.sourceRepo) {
                badges.push(`<a class="badge badge-type" href="https://github.com/${escapeHtml(skill.sourceRepo)}" target="_blank" rel="noopener" style="text-decoration:none;">${escapeHtml(skill.sourceRepo)}</a>`);
            }
            if (skill.published) {
                badges.push(`<span class="badge badge-status">已发布</span>`);
            } else {
                badges.push(`<span class="badge badge-status draft">草稿</span>`);
            }

            const versionBadge = skill.version
                ? `<span class="version-badge">v${escapeHtml(skill.version)}</span>`
                : '';

            const downloads = skill.downloads ?? 0;
            const views = skill.views ?? 0;
            const rating = skill.rating ?? 0;
            const ratingCount = skill.ratingCount ?? 0;
            let starsHtml = '';
            for (let i = 1; i <= 5; i++) {
                if (i <= Math.round(rating)) {
                    starsHtml += ICONS.star;
                } else {
                    starsHtml += ICONS.starEmpty;
                }
            }

            const favorites = skill.favorites ?? 0;
            const installCmd = skill.installCommand || `halo skill install ${skillName}`;

            main.innerHTML = `
                <div class="skill-header">
                    <div class="skill-header-top">
                        <div class="skill-icon-xl ${colorClass}">${escapeHtml(initial)}</div>
                        <div class="skill-info-main">
                            <div class="skill-title-row">
                                <h1 class="skill-name">${escapeHtml(skill.displayName)}</h1>
                                ${versionBadge}
                            </div>
                            <div class="skill-badges-row">${badges.join('')}</div>
                            ${skill.summary ? `<p class="skill-summary">${escapeHtml(skill.summary)}</p>` : ''}
                            <div class="author-row">
                                <div class="author-avatar">${escapeHtml(authorInitial)}</div>
                                <span class="author-name">${escapeHtml(skill.author || '匿名作者')}</span>
                            </div>
                        </div>
                    </div>

                    <div class="stats-row">
                        <div class="stat-item" title="浏览量">
                            ${ICONS.clock}
                            <span class="stat-value">${formatNumber(views)}</span>
                            <span>浏览</span>
                        </div>
                        <div class="stat-item" title="下载量">
                            ${ICONS.download}
                            <span class="stat-value">${formatNumber(downloads)}</span>
                            <span>下载</span>
                        </div>
                        <div class="stat-item rating" title="评分">
                            <div class="stat-stars">${starsHtml}</div>
                            <span class="stat-value">${rating > 0 ? rating.toFixed(1) : '-'}</span>
                            <span>(${formatNumber(ratingCount)})</span>
                        </div>
                    </div>

                    <div class="action-row">
                        <button class="action-btn" onclick="downloadSkillZip()">
                            ${ICONS.download}
                            <span>下载</span>
                        </button>
                        <button class="action-btn" onclick="copyPrimaryInstallCmd()">
                            ${ICONS.terminal}
                            <span>复制安装命令</span>
                        </button>
                    </div>
                </div>
                <div id="skillhub-section"></div>

                <div id="tab-section"></div>
                <div id="install-section"></div>
                <div id="related-section"></div>
            `;
        }

        function renderTabs() {
            const tabSection = document.getElementById('tab-section');
            const hasCodeFiles = files.filter(f => f.language && f.language !== 'markdown').length > 0;

            const tabs = [
                { id: 'readme', label: 'README', icon: ICONS.book }
            ];
            if (hasCodeFiles) {
                tabs.push({ id: 'files', label: '代码文件', icon: ICONS.code });
            }

            tabSection.innerHTML = `
                <div class="tab-nav">
                    ${tabs.map((t, i) => `
                        <button class="tab-btn ${i === 0 ? 'active' : ''}" data-tab="${t.id}">
                            ${t.icon}${t.label}
                        </button>
                    `).join('')}
                </div>
                <div class="tab-content active" id="tab-readme"></div>
                ${hasCodeFiles ? '<div class="tab-content" id="tab-files"></div>' : ''}
            `;

            tabSection.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => showTab(btn.dataset.tab));
            });

            renderReadmeTab();
            if (hasCodeFiles) renderFilesTab();
        }

        function showTab(tabId) {
            const tabSection = document.getElementById('tab-section');
            tabSection.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.tab === tabId);
            });
            tabSection.querySelectorAll('.tab-content').forEach(c => {
                c.classList.toggle('active', c.id === 'tab-' + tabId);
            });
        }

        function renderReadmeTab() {
            const readmeContent = files.find(f => f.language === 'markdown') || files[0];
            const el = document.getElementById('tab-readme');
            if (!readmeContent || !readmeContent.content) {
                el.innerHTML = `
                    <div class="empty-state" style="padding:40px;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        <h2>暂无文档</h2>
                        <p>该技能没有提供 README 文档</p>
                    </div>`;
                return;
            }
            try {
                const html = marked.parse(readmeContent.content);
                el.innerHTML = `<div class="markdown-body">${html}</div>`;
                if (window.hljs) {
                    el.querySelectorAll('pre code').forEach(block => {
                        hljs.highlightElement(block);
                    });
                }
            } catch (e) {
                el.innerHTML = `<div class="markdown-body"><pre style="background:var(--bg-tertiary); padding:16px; border-radius:8px;">${escapeHtml(readmeContent.content)}</pre></div>`;
            }
        }

        function renderFilesTab() {
            const el = document.getElementById('tab-files');
            const codeFiles = files.filter(f => f.language && f.language !== 'markdown');
            if (codeFiles.length === 0) {
                el.innerHTML = `
                    <div class="empty-state" style="padding:40px;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        <h2>暂无代码文件</h2>
                        <p>该技能没有包含代码文件</p>
                    </div>`;
                return;
            }

            const fileTreeHtml = codeFiles.map((f, i) => {
                const lang = f.language || guessLanguage(f.path);
                return `
                    <button class="file-item ${i === 0 ? 'active' : ''}" data-index="${i}">
                        ${getLangIcon(lang)}
                        <span class="file-name" title="${escapeHtml(f.path)}">${escapeHtml(f.name || f.path)}</span>
                        ${lang ? `<span class="file-lang">${escapeHtml(lang)}</span>` : ''}
                    </button>
                `;
            }).join('');

            el.innerHTML = `
                <div class="files-layout">
                    <div class="file-tree-panel">
                        <div class="file-tree-title">代码文件 (${codeFiles.length})</div>
                        <div class="file-tree">${fileTreeHtml}</div>
                    </div>
                    <div class="code-viewer-panel" id="code-viewer-panel"></div>
                </div>
            `;

            el.querySelectorAll('.file-item').forEach(item => {
                item.addEventListener('click', () => {
                    el.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    const idx = parseInt(item.dataset.index);
                    showCodeFile(codeFiles[idx]);
                });
            });

            showCodeFile(codeFiles[0]);
        }

        function showCodeFile(file) {
            const panel = document.getElementById('code-viewer-panel');
            const lang = file.language || guessLanguage(file.path) || 'plaintext';
            const content = file.content || '';
            const highlighted = window.hljs
                ? hljs.highlight(content, { language: lang }).value
                : escapeHtml(content);
            const lines = content.split('\n').length;
            const lineNumbers = Array.from({length: lines}, (_, i) => i + 1).join('\n');

            panel.innerHTML = `
                <div class="code-viewer">
                    <div class="code-viewer-header">
                        <div class="code-viewer-title">
                            <span class="filename">${escapeHtml(file.path)}</span>
                            <span class="code-lang-pill">${escapeHtml(lang)}</span>
                            <span style="color: var(--text-muted); font-size: 12px;">${lines} 行</span>
                        </div>
                        <button class="copy-btn" onclick="copyById('code-block-viewer')">
                            ${ICONS.copy}复制
                        </button>
                    </div>
                    <div class="code-viewer-body">
                        <div class="code-line-numbers">${lineNumbers}</div>
                        <div class="code-content">
                            <pre><code id="code-block-viewer" class="language-${escapeHtml(lang)}">${highlighted}</code></pre>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderInstallSection(skill) {
            const el = document.getElementById('install-section');
            const cmds = buildInstallCmds(skill);
            el.innerHTML = `
                <div class="install-section">
                    <h3>${ICONS.terminal} 安装命令</h3>
                    <p>${skill.sourceRepo
                        ? '推荐使用 npx skills 一行命令安装（自动适配 Claude Code / ZCode / Cursor 等 75+ 客户端，需 Node.js 22+）；也可从本站下载 ZIP 手动安装'
                        : '根据您的操作系统，使用以下命令下载并安装此技能包'}</p>
                    ${cmds.map((c, i) => `
                        <div class="install-code-box" style="margin-bottom:10px;">
                            <div class="install-code-header">
                                <span class="install-code-title">${c.os}</span>
                                <button class="copy-btn" onclick="copyText(\`${escapeHtml(c.cmd)}\`).then(()=>showToast('安装命令已复制'))">
                                    ${ICONS.copy}复制
                                </button>
                            </div>
                            <div class="install-code-body">
                                <pre><code>${escapeHtml(c.cmd)}</code></pre>
                            </div>
                            ${c.hint ? `<div class="install-code-header" style="border-top:1px solid var(--border);"><span class="install-code-title" style="font-weight:400;color:var(--text-muted);">${escapeHtml(c.hint)}</span></div>` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function downloadUrl() {
            return API_BASE + '/skills/' + encodeURIComponent(skillName) + '/download';
        }

        /**
         * Install command candidates. GitHub-hosted skills prefer the npx skills
         * ecosystem command; platform-specific download commands from this site's
         * ZIP endpoint are always offered as fallback.
         */
        function buildInstallCmds(skill) {
            const url = new URL(downloadUrl(), location.origin).toString();
            const safeName = encodeURIComponent(skillName);
            const cmds = [];
            if (skill.sourceRepo) {
                cmds.push({
                    os: 'npx（推荐）',
                    cmd: `npx skills add ${skill.sourceRepo}`,
                    hint: skill.sourceSubdir
                        ? `技能位于仓库子目录 ${skill.sourceSubdir}，若命令未能定位请使用下方命令下载后解压`
                        : '自动识别本机已安装的 AI 客户端并安装到对应 skills 目录'
                });
            }
            cmds.push({
                os: 'macOS / Linux · bash',
                cmd: `mkdir -p "$HOME/.claude/skills" && curl -fsSL '${url}' -o "/tmp/${safeName}.zip" && unzip -o "/tmp/${safeName}.zip" -d "$HOME/.claude/skills/${safeName}"`,
                hint: '解压到 Claude Code 全局技能目录 ~/.claude/skills（其他客户端请替换为目标目录）'
            });
            cmds.push({
                os: 'Windows · PowerShell',
                cmd: `$dir = Join-Path $env:USERPROFILE '.claude\\skills\\${safeName}'; New-Item -ItemType Directory -Force -Path $dir | Out-Null; Invoke-WebRequest -Uri '${url}' -OutFile "$env:TEMP\\${safeName}.zip"; Expand-Archive -Path "$env:TEMP\\${safeName}.zip" -DestinationPath $dir -Force`,
                hint: '解压到 Claude Code 全局技能目录 %USERPROFILE%\\.claude\\skills（其他客户端请替换为目标目录）'
            });
            return cmds;
        }

        function downloadSkillZip() {
            const a = document.createElement('a');
            a.href = downloadUrl();
            a.download = '';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        async function renderRelatedSkills(skill) {
            const el = document.getElementById('related-section');
            el.innerHTML = `
                <div class="related-section">
                    <div class="related-header">
                        <h2 class="related-title">${ICONS.link} 相关推荐</h2>
                    </div>
                    <div class="related-grid" id="related-grid">
                        <div class="loading">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        </div>
                    </div>
                </div>
            `;

            try {
                const data = await fetch(`${API_BASE}/skills/${encodeURIComponent(skillName)}/related?limit=4`).then(r => r.json());
                const grid = document.getElementById('related-grid');
                const related = Array.isArray(data) ? data : (data.content || []);

                if (!related || related.length === 0) {
                    grid.innerHTML = '<div class="related-empty">暂无相关技能</div>';
                    return;
                }

                grid.innerHTML = related.map(s => {
                    const initial = getInitial(s.displayName || s.name);
                    const colorClass = getIconColor(s.name || s.displayName);
                    const summary = s.summary || '暂无描述';
                    return `
                        <a class="related-card" href="/showcase/${escapeHtml(s.name)}">
                            <div class="related-icon ${colorClass}">${escapeHtml(initial)}</div>
                            <div class="related-info">
                                <div class="related-name">${escapeHtml(s.displayName)}</div>
                                <div class="related-summary">${escapeHtml(summary)}</div>
                            </div>
                        </a>
                    `;
                }).join('');
            } catch (e) {
                const grid = document.getElementById('related-grid');
                if (grid) grid.innerHTML = '<div class="related-empty">加载相关技能失败</div>';
            }
        }

        function copyPrimaryInstallCmd() {
            const cmds = buildInstallCmds(skillData || {});
            if (cmds.length) {
                copyText(cmds[0].cmd).then(() => {
                    showToast('安装命令已复制');
                });
            }
        }

        /* ----- skillhub-style VSCode file browser ----- */

        function skillHubFileUrl(path) {
            return '/showcase/' + encodeURIComponent(skillName) + '/' +
                path.split('/').map(encodeURIComponent).join('/');
        }

        function renderSkillHubBrowser(skill) {
            const el = document.getElementById('skillhub-section');
            el.innerHTML = `
                <div class="hub-browser">
                    <div class="hub-filetree">
                        <div class="hub-tree-title">
                            ${ICONS.file} <span>文件 <span class="hub-tree-count">(加载中…)</span></span>
                        </div>
                        <div class="hub-tree" id="hub-tree">Loading…</div>
                    </div>
                    <div class="hub-viewer" id="hub-viewer">
                        <div class="loading">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        </div>
                    </div>
                </div>
            `;
            loadSkillHubTree(skill);
        }

        async function loadSkillHubTree(skill) {
            const treeEl = document.getElementById('hub-tree');
            try {
                const nodes = await fetch(`${API_BASE}/skills/${encodeURIComponent(skillName)}/tree`).then(r => r.json());
                if (!Array.isArray(nodes)) throw new Error('bad tree');
                let fileCount = 0;
                const countFiles = arr => arr.forEach(n => { if (n.type === 'file') fileCount++; else if (n.children) countFiles(n.children); });
                countFiles(nodes);
                const countEl = document.querySelector('.hub-tree-count');
                if (countEl) countEl.textContent = '(' + fileCount + ' 个文件)';
                treeEl.innerHTML = renderTreeNodes(nodes, 0, true);
                treeEl.querySelectorAll('.hub-folder-toggle').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const row = btn.closest('.hub-folder');
                        row.classList.toggle('collapsed');
                    });
                });
                treeEl.querySelectorAll('.hub-file').forEach(elm => {
                    elm.addEventListener('click', () => {
                        treeEl.querySelectorAll('.hub-file').forEach(f => f.classList.remove('active'));
                        elm.classList.add('active');
                        loadSkillHubFile(skill, elm.dataset.path);
                    });
                });
                const entry = skill.entryFile && skill.entryFile !== 'index.html' ? skill.entryFile : null;
                const target = entry || null;
                if (target) {
                    const fileElm = treeEl.querySelector('.hub-file[data-path="' + cssEscape(target) + '"]');
                    if (fileElm) fileElm.classList.add('active');
                }
                if (target) {
                    loadSkillHubFile(skill, target);
                } else {
                    document.getElementById('hub-viewer').innerHTML = `
                        <div class="empty-state" style="padding:48px;">
                            <h2>选择一个文件</h2><p>从左侧文件树选择文件进行查看</p>
                        </div>`;
                }
            } catch (e) {
                treeEl.innerHTML = '<div style="color:var(--text-muted);padding:12px;">文件树加载失败</div>';
            }
        }

        function cssEscape(str) {
            if (window.CSS && CSS.escape) return CSS.escape(str);
            return String(str).replace(/["\\]/g, '\\$&').replace(/['"`]/g, c => '\\' + c);
        }

        function renderTreeNodes(nodes, depth, withHeader) {
            return nodes.map(n => {
                const pad = 'style="padding-left:' + (14 * depth + 4) + 'px"';
                if (n.type === 'dir') {
                    const child = (n.children && n.children.length) ? renderTreeNodes(n.children, depth + 1, false) : '';
                    return `
                        <div class="hub-folder ${depth === 0 ? 'expanded' : 'collapsed'}">
                            <div class="hub-folder-row" ${pad}>
                                <span class="hub-folder-toggle">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><polyline points="9 18 15 12 9 6"/></svg>
                                </span>
                                <svg class="hub-folder-icon" viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                                <span class="hub-folder-name">${escapeHtml(n.name)}</span>
                            </div>
                            <div class="hub-folder-children">${child}</div>
                        </div>`;
                }
                const lang = n.language && n.language !== 'text' ? n.language : guessLanguage(n.path);
                return `
                    <div class="hub-file" data-path="${escapeHtml(n.path)}" ${pad}>
                        ${getLangIcon(lang ? lang : 'default')}
                        <span class="hub-file-name">${escapeHtml(n.name)}</span>
                    </div>`;
            }).join('');
        }

        async function loadSkillHubFile(skill, path) {
            const el = document.getElementById('hub-viewer');
            el.innerHTML = `<div class="loading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>`;
            try {
                const resp = await fetch(skillHubFileUrl(path));
                if (!resp.ok) throw new Error('not found');
                const text = await resp.text();
                loadedContents[path] = text;
                const name = path.split('/').pop();
                const ext = (name.split('.').pop() || '').toLowerCase();
                const isMarkdown = ['md', 'markdown', 'pdc'].includes(ext);
                if (isMarkdown) {
                    const html = marked.parse(text);
                    el.innerHTML = `
                        <div class="code-viewer-header">
                            <div class="code-viewer-title"><span class="filename">${escapeHtml(path)}</span><span class="code-lang-pill">markdown</span></div>
                        </div>
                        <div class="hub-md-body"><div class="markdown-body">${html}</div></div>`;
                    if (window.hljs) el.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
                } else {
                    const lang = guessLanguage(path) || 'plaintext';
                    const highlighted = (window.hljs && lang)
                        ? hljs.highlight(text, { language: lang }).value
                        : escapeHtml(text);
                    const lines = text.split('\n').length;
                    el.innerHTML = `
                        <div class="code-viewer-header">
                            <div class="code-viewer-title">
                                <span class="filename">${escapeHtml(path)}</span>
                                <span class="code-lang-pill">${escapeHtml(lang)}</span>
                                <span style="color:var(--text-muted);font-size:12px;">${lines} 行</span>
                            </div>
                            <button class="copy-btn" onclick="copyLoaded('${cssEscapeSingle(path)}')">${ICONS.copy}复制</button>
                        </div>
                        <div class="code-viewer-body">
                            <div class="code-line-numbers">${Array.from({length:lines},(_,i)=>i+1).join('\n')}</div>
                            <div class="code-content"><pre><code class="language-${escapeHtml(lang)}">${highlighted}</code></pre></div>
                        </div>`;
                }
            } catch (e) {
                el.innerHTML = '<div class="empty-state" style="padding:48px;"><h2>无法加载文件</h2><p>文件不存在或读取失败</p></div>';
            }
        }

        function cssEscapeSingle(str) {
            return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        function copyLoaded(path) {
            const t = loadedContents[path] || '';
            return copyText(t).then(() => showToast('内容已复制'));
        }

        function copyById(id) {
            const el = document.getElementById(id);
            if (el) {
                copyText(el.textContent).then(() => {
                    showToast('代码已复制');
                });
            }
        }

        init();
    </script>
</body>
</html>
